<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - TEXroad</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: #81d4fa;
      color: #0d47a1;
      overflow-x: hidden;
      position: relative;
    }

    /* Dalga animasyonu arka plan */
    .wave-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .wave {
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.3), transparent 70%);
      animation: waveMove 20s linear infinite;
    }

    .wave:nth-child(2) {
      animation-duration: 30s;
      opacity: 0.5;
    }

    @keyframes waveMove {
      0% { transform: translate(0,0); }
      50% { transform: translate(-50px, 50px); }
      100% { transform: translate(0,0); }
    }

    header.hero {
      position: relative;
      height: 40vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-top: 50px;
      z-index: 1;
    }

    header.hero h1 {
      font-size: 4rem;
      margin: 0;
      font-weight: bold;
      background: linear-gradient(90deg, #0288d1, #00b0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 3px 3px 10px rgba(0,0,0,0.3);
    }

    header.hero p {
      font-size: 1.5rem;
      margin-top: 10px;
      max-width: 600px;
      background: linear-gradient(90deg, #0288d1, #00b0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
    }

    section.content {
      max-width: 600px;
      margin: -50px auto 50px auto;
      background-color: rgba(255,255,255,0.85);
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      padding: 40px;
      z-index: 1;
      position: relative;
      text-align: center;
    }

    .contact-info {
      font-size: 1.2rem;
      line-height: 2;
      color: #0d47a1;
    }

    .contact-info a {
      color: #0288d1;
      text-decoration: none;
    }

    .contact-info a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      color: rgba(0,0,50,0.6);
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="wave-bg">
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

  <header class="hero">
    <h1>Contact Me</h1>
    <p>Get in touch with TEXroad for collaborations and inquiries.</p>
  </header>

  <section class="content">
    <div class="contact-info">
      <p><strong>Phone:</strong> <a href="tel:+905385403462">0538 540 3462</a></p>
      <p><strong>Email:</strong> <a href="mailto:kayahanunal2009@gmail.com">kayahanunal2009@gmail.com</a></p>
      <p><strong>Location:</strong> Kayseri, Melikgazi, İstem Koleji</p>
    </div>
  </section>

  <footer>
    &copy; 2025 TEXroad Project
  </footer>

</body>
</html>
