<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reduce waste! Rebuild City!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e8f5e9;
      color: #2e3a7d;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      overflow: hidden;
    }

    h1.main-title {
      font-size: 12rem;
      font-weight: bold;
      margin: 30px 0 0 0;
      background: linear-gradient(90deg, #434ca01e, #0000001a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: rgba(46, 125, 50, 0.192);
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.089);
      position: relative;
      z-index: 1;
      line-height: 1;
      animation: floatText 6s ease-in-out infinite alternate;
    }

    @keyframes floatText {
      0% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0); }
    }

    p.subtitle {
      font-size: 1.4rem;
      max-width: 700px;
      margin-top: -40px;
      text-align: center;
      line-height: 1.4;
      position: relative;
      z-index: 2;
      font-weight: bold;
      background: linear-gradient(90deg, #2e3c7de1, #43a098);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.459);
    }

    .button-container {
      display: flex;
      flex-direction: column; 
      gap: 20px;
      margin-top: 40px;
      z-index: 2;
      position: relative;
      align-items: center;
    }

    button.custom-button {
      background-color: #000000;
      color: white;
      padding: 15px 60px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }

    button.custom-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 200%;
      height: 100%;
      background: linear-gradient(120deg, rgba(255,255,255,0.2), rgba(255,255,255,0.5), rgba(255,255,255,0.2));
      transform: skewX(-20deg);
      z-index: 1;
      animation: wave 2s linear infinite;
    }

    button.custom-button span {
      position: relative;
      z-index: 2;
    }

    @keyframes wave {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    button.custom-button:hover {
      background-color: #2e3c7d;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .wave-container {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 200px;
      overflow: hidden;
      z-index: 0;
    }

    .wave {
      position: absolute;
      bottom: 0;
      width: 200%;
      height: 100px;
      background: rgba(0, 150, 255, 0.4);
      border-radius: 1000px 1000px 0 0;
      animation: waveMove 6s linear infinite, fadeInOut 8s ease-in-out infinite;
      opacity: 0;
    }

    .wave.wave2 {
      bottom: 20px;
      background: rgba(0, 200, 255, 0.3);
      animation-duration: 8s, 10s;
      animation-direction: reverse, normal;
    }

    @keyframes waveMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 0; }
      20%, 80% { opacity: 0.6; }
    }

  </style>
</head>
<body>
  <h1 class="main-title">𝐓𝐄𝐗𝐫𝐨𝐚𝐝</h1>
  <p class="subtitle">We transform textile waste into sustainable urban roads, bike lanes, and pedestrian paths.</p>

  <div class="button-container">
    <button class="custom-button" onclick="window.open('problem.html','_blank')"><span>Beyond The Horizon</span></button>
    <button class="custom-button" onclick="window.open('about.html','_blank')"><span>About us</span></button>
    <button class="custom-button" onclick="window.open('pricing.html','_blank')"><span>Pricing</span></button>
    <button class="custom-button" onclick="window.open('signup.html','_blank')"><span>Sign Up</span></button>
  </div>

  <div class="wave-container">
    <div class="wave"></div>
    <div class="wave wave2"></div>
  </div>

</body>
</html>
